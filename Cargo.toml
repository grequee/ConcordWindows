[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/media",
    "crates/protocol",
    "crates/rtc",
    "crates/signaling-server",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
concord-core = { path = "crates/core" }
cpal = "0.18.2"
concord-media = { path = "crates/media" }
concord-protocol = { path = "crates/protocol" }
concord-rtc = { path = "crates/rtc" }
futures-util = "0.3.34"
libc = "0.2.177"
parking_lot = "0.13.0"
ringbuf = "0.4.8"
ring = "0.17.14"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rtc = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
opus = "0.4.0"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
webrtc = "0.21.1"
x11rb = { version = "0.14.0", features = ["image", "shm"] }

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
